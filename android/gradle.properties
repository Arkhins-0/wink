org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.compiler.execution.strategy=in-process

# --- Wink ------------------------------------------------------------------
# Defaults for the values the app is built with. Each one can be overridden,
# in this order of precedence: an environment variable (WINK_BASE_URL etc.),
# the same name in the root .env file, local.properties, then -P on the
# command line or here. See app/build.gradle.kts.
#
# Where the Wink server lives. No trailing slash.
wink.baseUrl=https://wink.arkhins.com
# The endpoint that reports the latest release. Blank = <baseUrl>/api/app-version.
wink.updateUrl=
# GitHub repository (owner/name) whose Releases carry the APKs. Used directly
# when the server cannot be reached, so updates work before the server exists.
wink.githubRepo=Arkhins-0/wink

# Built with JDK 21. Android Studio picks it from its Gradle JDK setting; on
# the command line set JAVA_HOME, or org.gradle.java.home in
# ~/.gradle/gradle.properties (machine-specific, so not here). CI uses 21 too.
